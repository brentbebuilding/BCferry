<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=./docs/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BC Ferry Tracker - Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #003f87, #00aeef);
            color: white;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #00aeef;
            background: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BC Ferry Tracker</h1>
        <div class="spinner"></div>
        <p>Redirecting to application...</p>
        <p>If you are not redirected, <a href="./docs/index.html">click here</a>.</p>
    </div>
    <script>
        // Backup redirect in case meta refresh doesn't work
        setTimeout(function() {
            window.location.href = './docs/index.html';
        }, 100);
    </script>
</body>
</html>
