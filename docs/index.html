<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="version" content="v2.0-dark-mode">
    <title>BC Ferry Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div>
                    <h1>BC Ferry Tracker</h1>
                    <p class="tagline">Big Boat Tracker 🚢</p>
                    <p class="subtitle">Real-time ferry schedules and capacity information</p>
                </div>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="dayFilter">Show:</label>
                <select id="dayFilter">
                    <option value="all">All Sailings</option>
                    <option value="today">Today Only</option>
                    <option value="tomorrow">Tomorrow Only</option>
                </select>
            </div>
            <div class="control-group">
                <label for="routeFilter">Filter by Route:</label>
                <select id="routeFilter">
                    <option value="all">All Routes</option>
                </select>
            </div>
            <div class="control-group">
                <button id="refreshBtn" class="btn-primary">Refresh Data</button>
            </div>
            <div class="last-updated">
                <span id="lastUpdated">Loading...</span>
            </div>
        </div>

        <div id="loadingIndicator" class="loading">
            <div class="spinner"></div>
            <p>Loading ferry data...</p>
        </div>

        <div id="errorMessage" class="error" style="display: none;"></div>

        <div id="routesContainer" class="routes-container">
            <!-- Routes will be dynamically inserted here -->
        </div>
    </div>

    <footer>
        <p>Data provided by <a href="https://www.bcferriesapi.ca" target="_blank">BC Ferries API</a></p>
        <p>Not affiliated with BC Ferries. For official information, visit <a href="https://www.bcferries.com" target="_blank">bcferries.com</a></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
